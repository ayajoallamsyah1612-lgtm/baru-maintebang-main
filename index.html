<body>

  <!-- Judul RGB -->
  <div class="judul-rgb">PROYEK GAME AYA JO ALLAM SYAH XII TKJ 2</div>

  </div>

  <!-- Easter Egg Tersembunyi Logo Merah Putih -->
  <div class="easter-egg-btn" id="easterEggBtn" title="???">

  <!-- Modal Shop (Kostum & Kapak) -->
  <div class="modal-toko" id="modalToko">

        <strong style="color:#fde047; font-size:15px;">🛒 SHOP ITEM & KOSTUM</strong>
        <span id="infoKoinToko" style="color:#4ade80; font-size:12px; font-weight:bold;">KOIN: 0</span>
      </div>

      </div>
      <div class="list-shop-scroll" id="daftarShop"></div>
      <button class="btn-aksi" id="btnTutupToko" style="width:100%; padding:9px; margin-top:8px; font-size:13px;">TUTUP SHOP</button>
    </div>
  </div>

  <!-- Overlay Cutscene & Hasil Final Boss -->
  <div class="overlay-cerita" id="overlayCerita">
    <div class="kotak-dialog" id="kotakDialog">
      <div id="judulCerita" style="font-size:14px; font-weight:bold; color:#ef4444; margin-bottom:10px;">⚠️ PERINGATAN ALAM ⚠️</div>
      <div id="isiCerita" style="font-size:13px; line-height:1.55; color:#f8fafc; margin-bottom:14px;"></div>
      <button class="btn-aksi" id="btnAksiCerita" style="display:none; width:100%; padding:10px; font-size:13px;">LANJUTKAN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const W = 240;
    const H = 360;

    // === AUDIO CHIPTUNE & EFEK SUARA ===
    let audioCtx = null;
    let musikAktif = true;
    let timerMusik = null;
    let indeksNada = 0;

    const melodi = [
      330, 392, 659, 523, 587, 784, 0, 659,
      523, 440, 494, 0, 440, 392, 659, 784
    ];

    const melodiBoss = [
      146, 155, 146, 130, 146, 174, 164, 130
    ];

    function inisialisasiAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function mainkanNada(frekuensi, durasi = 0.11, tipe = "square", volume = 0.035) {
      if (!musikAktif || !audioCtx || frekuensi <= 0) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = tipe;
        osc.frequency.setValueAtTime(frekuensi, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durasi);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durasi);
      } catch (e) {}
    }

    function mainkanTeriakanSeram() {
      if (!musikAktif || !audioCtx) return;
      try {
        const sekarang = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = "sawtooth";
        osc2.type = "square";

        osc1.frequency.setValueAtTime(420, sekarang);
        osc1.frequency.exponentialRampToValueAtTime(65, sekarang + 1.4);

        osc2.frequency.setValueAtTime(445, sekarang);
        osc2.frequency.exponentialRampToValueAtTime(58, sekarang + 1.4);

        gain.gain.setValueAtTime(0.14, sekarang);
        gain.gain.exponentialRampToValueAtTime(0.001, sekarang + 1.45);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(sekarang);
        osc2.start(sekarang);
        osc1.stop(sekarang + 1.45);
        osc2.stop(sekarang + 1.45);
      } catch (e) {}
    }

    function mulaiMusikLatar() {
      if (timerMusik) return;
      timerMusik = setInterval(() => {
        if (!musikAktif) return;
        const daftarNada = modeGame === "boss" ? melodiBoss : melodi;
        const nada = daftarNada[indeksNada % daftarNada.length];
        mainkanNada(nada, 0.13, modeGame === "boss" ? "sawtooth" : "square", 0.025);
        indeksNada++;
      }, 210);
    }

    const btnAudio = document.getElementById("btnAudio");
    btnAudio.addEventListener("click", () => {
      inisialisasiAudio();
      musikAktif = !musikAktif;
      btnAudio.textContent = musikAktif ? "🔊 MUSIK: ON" : "🔇 MUSIK: OFF";
      if (musikAktif) mulaiMusikLatar();
    });

    // === STATE GAME ===
    const NICKNAME = "aya jo allam syah";
    const MAX_POIN = 999;
    const TINGKAT_AWAL_RANTING = 5;

    let poin = 0;
    let koinPermanen = 0;
    let sisiPemain = "kiri";
    let ayunKapak = 0;
    let efekPukul = 0;
    let efekKenaRanting = 0;
    let getarLayar = 0;
    let popupTeks = [];
    let easterEggDiklaim = false;

    // Mode Game: "normal" | "cutscene" | "boss" | "kalah_boss"
    let modeGame = "normal";
    let finalBossSelesai = false;
    let nyawaPemainBoss = 5;
    let maxNyawaBoss = 30;
    let nyawaBoss = 30;
    let kulitBoss = 3; // Kulit lebih tebal: butuh 3x tebang untuk mengurangi 1 HP Boss
    let progresKubur = 0; // Animasi tertimbun tanah & diserap akar jadi tulang

    // Hanya 1 ranting aktif yang turun bertahap
    let rantingAktif = {
      sisi: Math.random() < 0.5 ? "kiri" : "kanan",
      tingkat: TINGKAT_AWAL_RANTING
    };

    // === DATA SHOP: KAPAK & KOSTUM ===
    const daftarDataKapak = [
      { id: "kayu",    nama: "Kapak Kayu",     desc: "+1 Poin setiap tebangan", harga: 0,    warna: "#cbd5e1" },
      { id: "perunggu",nama: "Kapak Perunggu", desc: "+2 Poin setiap tebangan", harga: 50,   warna: "#d97706" },
      { id: "perak",   nama: "Kapak Perak",    desc: "+3 Poin setiap tebangan", harga: 150,  warna: "#f1f5f9" },
      { id: "emas",    nama: "Kapak Emas",     desc: "+4 Poin setiap tebangan", harga: 300,  warna: "#facc15" },
      { id: "berlian", nama: "Kapak Berlian",  desc: "+10 Poin setiap tebangan",harga: 650,  warna: "#38bdf8" },
      { id: "ganda",   nama: "Kapak Ganda",    desc: "Kemampuan Poin Double (2x)", harga: 900, warna: "#f43f5e" },
      { id: "dewa",    nama: "Kapak Dewa ⚡",   desc: "Retakan petir, kebal ranting (Non-Boss)", harga: 1500, warna: "#a855f7" },
      { id: "admin",   nama: "Kapak Admin 👑", desc: "Abadi & +100 Poin/pukulan (Hadiah Boss)", harga: -1, warna: "#fde047" }
    ];

    const daftarDataKostum = [
      { id: "default", nama: "Penebang Klasik",   desc: "Seragam penebang standar", harga: 0 },
      { id: "badut",   nama: "Kostum Badut",      desc: "Penampilan sirkus ceria", harga: 100 },
      { id: "kelinci", nama: "Kostum Kelinci",    desc: "Telinga kelinci putih", harga: 100 },
      { id: "zelda",   nama: "The Legend of Zelda", desc: "Tunik hijau pahlawan", harga: 1000 },
      { id: "mario",   nama: "Mario Bros",        desc: "Topi merah & overall biru", harga: 1000 },
      { id: "raja_emas", nama: "Kostum Raja Emas 👑", desc: "Zirah emas sang GOAT (Hadiah Boss)", harga: -1 }
    ];

    let kapakDimiliki = ["kayu"];
    let kapakDipakai = "kayu";

    let kostumDimiliki = ["default"];
    let kostumDipakai = "default";
    let tabShopAktif = "kapak";

    function resetRantingAtas() {
      rantingAktif = {
        sisi: Math.random() < 0.5 ? "kiri" : "kanan",
        tingkat: TINGKAT_AWAL_RANTING
      };
    }

    function tambahPopup(teks, x, y, warna) {
      popupTeks.push({ teks, x, y, warna, umur: 32 });
    }

    function hitungPoinTebangan() {
      if (kapakDipakai === "admin") return 100;
      if (kapakDipakai === "perunggu") return 2;
      if (kapakDipakai === "perak") return 3;
      if (kapakDipakai === "emas") return 4;
      if (kapakDipakai === "berlian") return 10;
      if (kapakDipakai === "ganda") return Math.max(2, (poin % 10 === 0 ? 4 : 2));
      if (kapakDipakai === "dewa") return 5;
      return 1;
    }

    // === CUTSCENE & FINAL BOSS ===
    const overlayCerita = document.getElementById("overlayCerita");
    const kotakDialog = document.getElementById("kotakDialog");
    const judulCerita = document.getElementById("judulCerita");
    const isiCerita = document.getElementById("isiCerita");
    const btnAksiCerita = document.getElementById("btnAksiCerita");

    function mulaiCutsceneBoss() {
      modeGame = "cutscene";
      kotakDialog.classList.remove("menang");
      judulCerita.style.color = "#ef4444";
      judulCerita.textContent = "🌲 ROH POHON RAKSASA BANGKIT 🌲";
      btnAksiCerita.style.display = "none";
      overlayCerita.classList.add("aktif");

      isiCerita.innerHTML = `<em>"kenapa.... kenapa kmu menyiksa alam, menyiksa bumi, menyiksa ku..???"</em>`;
      mainkanNada(110, 0.6, "sawtooth", 0.08);

      setTimeout(() => {
        isiCerita.innerHTML = `<strong style="font-size:20px; color:#ef4444; letter-spacing:2px;">"ARGGGGGG!!!"</strong><br><span style="font-size:11px; color:#fca5a5;">Pohon raksasa bermata darah & bermulut api muncul!</span>`;
        getarLayar = 28;
        mainkanTeriakanSeram();
      }, 3200);

      setTimeout(() => {
        overlayCerita.classList.remove("aktif");
        modeGame = "boss";
        nyawaPemainBoss = 5;
        nyawaBoss = maxNyawaBoss;
        kulitBoss = 3;
        resetRantingAtas();
        document.getElementById("teksPetunjuk").innerHTML =
          `<span style="color:#f87171; font-weight:bold;">FINAL BOSS! Kulit boss 3x tebal! Hindari ranting (5 Nyawa)!</span>`;
      }, 5600);
    }

    function tanganiKalahBoss() {
      modeGame = "kalah_boss";
      progresKubur = 0;
      mainkanNada(90, 0.8, "sawtooth", 0.09);

      setTimeout(() => {
        kotakDialog.classList.remove("menang");
        judulCerita.style.color = "#ef4444";
        judulCerita.textContent = "💀 KAMU DITELAN ALAM 💀";
        isiCerita.innerHTML = `Karaktermu tertimbun tanah dan diserap akar pohon hingga menjadi tulang belulang...`;
        btnAksiCerita.textContent = "BANGKIT & COBA LAGI";
        btnAksiCerita.style.display = "block";
        btnAksiCerita.onclick = () => {
          overlayCerita.classList.remove("aktif");
          poin = 998;
          modeGame = "normal";
          resetRantingAtas();
          document.getElementById("teksPetunjuk").innerHTML =
            `1 Tebangan = +Poin & +Koin Permanen (Max 999 Poin)<br>Hindari 1 ranting yang turun agar poin tidak berkurang!`;
        };
        overlayCerita.classList.add("aktif");
      }, 2600);
    }

    function tanganiMenangBoss() {
      finalBossSelesai = true;
      modeGame = "normal";
      poin = 999;

      if (!kapakDimiliki.includes("admin")) kapakDimiliki.push("admin");
      if (!kostumDimiliki.includes("raja_emas")) kostumDimiliki.push("raja_emas");
      kapakDipakai = "admin";
      kostumDipakai = "raja_emas";

      mainkanNada(523, 0.15, "square", 0.07);
      setTimeout(() => mainkanNada(659, 0.15, "square", 0.07), 150);
      setTimeout(() => mainkanNada(784, 0.15, "square", 0.07), 300);
      setTimeout(() => mainkanNada(1046, 0.35, "square", 0.08), 450);

      kotakDialog.classList.add("menang");
      judulCerita.style.color = "#facc15";
      judulCerita.textContent = "👑 FINAL BOSS DIKALAHKAN! 👑";
      isiCerita.innerHTML = `
        <p style="color:#fde047; font-weight:bold; font-size:13px;">
          "kamu bukan lah pemain kamu adalah goat, bangga lah terhadap dirimu sendiri"
        </p>
        <p style="color:#38bdf8; font-weight:bold; margin-top:4px;">...ayajo</p>
        <div style="background:#1e293b; border:1px solid #facc15; border-radius:8px; padding:8px; margin-top:10px; font-size:11px; color:#4ade80;">
          🎁 REWARD OTOMATIS DIPAKAI:<br>
          • <b>Kapak Admin</b> (Abadi, +100 Poin/pukulan)<br>
          • <b>Kostum Raja Berwarna Emas</b>
        </div>
      `;
      btnAksiCerita.textContent = "LANJUT BERMAIN";
      btnAksiCerita.style.display = "block";
      btnAksiCerita.onclick = () => {
        overlayCerita.classList.remove("aktif");
        document.getElementById("teksPetunjuk").innerHTML =
          `<span style="color:#fde047;">MODE GOAT: Kapak Admin (+100 Poin) & Kostum Raja Emas Aktif!</span>`;
      };
      overlayCerita.classList.add("aktif");

    // === LOGIKA MENEBANG ===
    function tebang(sisiBaru) {
      if (modeGame === "cutscene" || modeGame === "kalah_boss") return;

      inisialisasiAudio();
      mulaiMusikLatar();

      sisiPemain = sisiBaru;
      ayunKapak = 8;
      efekPukul = 4;

      mainkanNada(240, 0.06, "triangle", 0.07);

      const kebalRanting =
        (kapakDipakai === "dewa" && modeGame === "normal") ||
        kapakDipakai === "admin";

      function prosesKenaRanting() {
        if (kebalRanting) {
          const posX = sisiPemain === "kiri" ? 68 : 172;
          tambahPopup("⚡ KEBAL RANTING!", posX, 215, "#c084fc");
          resetRantingAtas();
          return false;
        }

        efekKenaRanting = 10;
        getarLayar = 8;
        mainkanNada(140, 0.18, "sawtooth", 0.08);
        const posX = sisiPemain === "kiri" ? 68 : 172;

        if (modeGame === "boss") {
          nyawaPemainBoss -= 1;
          tambahPopup("-1 NYAWA!", posX, 215, "#ef4444");
          resetRantingAtas();
          if (nyawaPemainBoss <= 0) {
            tanganiKalahBoss();
          }
        } else {
          poin = Math.max(0, poin - 1);
          tambahPopup("-1 KENA RANTING!", posX, 215, "#ff4d4d");
          resetRantingAtas();
        }
        return true;
      }

      if (rantingAktif.tingkat === 0 && rantingAktif.sisi === sisiPemain) {
        if (prosesKenaRanting()) return;
      } else if (rantingAktif.tingkat > 0) {
        rantingAktif.tingkat -= 1;
        if (rantingAktif.tingkat === 0 && rantingAktif.sisi === sisiPemain) {
          if (prosesKenaRanting()) return;
        }
      } else {
        resetRantingAtas();
      }

      if (modeGame === "boss") {
        kulitBoss -= 1;
        if (kulitBoss > 0) {
          tambahPopup("KULIT TEBAL! (" + kulitBoss + "x lagi)", 120, 175, "#fbbf24");
          mainkanNada(190, 0.07, "square", 0.05);
        } else {
          kulitBoss = 3;
          nyawaBoss -= 1;
          koinPermanen += 5;
          tambahPopup("-1 HP BOSS! (+5 KOIN)", 120, 175, "#4ade80");
          mainkanNada(620, 0.09, "square", 0.06);
          if (nyawaBoss <= 0) {
            tanganiMenangBoss();
          }
        }
        return;
      }

      const tambahanPoin = hitungPoinTebangan();
      const poinSebelum = poin;

      if (kapakDipakai === "admin") {
        poin += 100;
      } else {
        poin = Math.min(MAX_POIN, poin + tambahanPoin);
      }

      koinPermanen += tambahanPoin;
      tambahPopup("+" + tambahanPoin + " POIN | +" + tambahanPoin + " KOIN", 120, 175, "#4dff88");
      mainkanNada(660, 0.08, "square", 0.045);

      if (!finalBossSelesai && poinSebelum < MAX_POIN && poin >= MAX_POIN) {
        mulaiCutsceneBoss();
      }
    }

    // === GAMBAR POPUP TEKS ===
    function gambarPopup() {
      ctx.font = "bold 9px 'Courier New', monospace";
      ctx.textAlign = "center";
      for (let i = popupTeks.length - 1; i >= 0; i--) {
        const p = popupTeks[i];
        ctx.fillStyle = "#0f172a";
        ctx.fillText(p.teks, p.x + 1, p.y + 1);
        ctx.fillStyle = p.warna;
        ctx.fillText(p.teks, p.x, p.y);

      infoKoinToko.textContent = "KOIN: " + koinPermanen;

      dataSumber.forEach((item) => {
        const sudahPunya = listMilik.includes(item.id);

        const khususBoss = item.harga < 0;
        const cukupKoin = !khususBoss && koinPermanen >= item.harga;

        const baris = document.createElement("div");
        baris.className = "item-kostum" + (khususBoss ? " spesial-admin" : "");

        const labelHarga = khususBoss
          ? "Hadiah Kalahkan Final Boss"
          : (item.harga === 0 ? "Gratis" : item.harga + " Koin");

        const info = document.createElement("div");
        info.innerHTML = `
          <div style="font-size:12px; font-weight:bold; color:#f8fafc;">${item.nama}</div>
          <div style="font-size:10px; color:#94a3b8; margin:2px 0;">${item.desc}</div>
          <div style="font-size:10px; color:#facc15; font-weight:bold;">${labelHarga}</div>
        `;

        const btn = document.createElement("button");
        btn.className = "btn-beli";

        if (sedangDipakai) {
          btn.textContent = "DIPAKAI";
          btn.classList.add("dipakai");
        } else if (sudahPunya) {
          btn.textContent = "PAKAI";
          btn.onclick = () => {
            if (tabShopAktif === "kapak") kapakDipakai = item.id;
            else kostumDipakai = item.id;
            mainkanNada(523, 0.1, "square", 0.05);
            renderShop();
          };
        } else if (khususBoss) {
          btn.textContent = "BOSS";
          btn.classList.add("terkunci");
        } else if (cukupKoin) {
          btn.textContent = "BELI";
          btn.onclick = () => {
            koinPermanen -= item.harga;
            if (tabShopAktif === "kapak") {
              kapakDimiliki.push(item.id);
              kapakDipakai = item.id;
            } else {
              kostumDimiliki.push(item.id);
              kostumDipakai = item.id;
            }
            mainkanNada(784, 0.15, "square", 0.06);
            renderShop();
          };
        } else {
          btn.textContent = "KURANG";
          btn.classList.add("terkunci");
        }

        baris.appendChild(info);
        baris.appendChild(btn);
        daftarShopEl.appendChild(baris);
      });
    }

    document.getElementById("btnBukaToko").addEventListener("click", () => {
      renderShop();

    // === GAME LOOP UTAMA ===

      if (efekPukul > 0) efekPukul--;
