name: Build Android APK

on:
  push:
    branches: [ "utama", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/
          elif [ -f indeks.html ]; then
            cp indeks.html www/index.html
          else
            echo "index.html or indeks.html not found"
            exit 1
          fi

      - name: Initialize Capacitor and Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Tebang Pohon" "com.example.tebangpohon" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tebang-pohon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
